<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your ApexAuto car enthusiast account.">
  <title>ApexAuto | Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #1e293b;
      --muted: #334155;
      --line: rgba(255, 255, 255, 0.4);
      --white: #ffffff;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      font-family: "Nunito", sans-serif;
      /* Studio Ghibli Workshop / Garage style background */
      background: #0e973b url("https://images.alphacoders.com/131/1315830.jpg") center / cover fixed no-repeat;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      /* Warm ambient overlay for high readability */
      background: linear-gradient(180deg, rgba(30, 45, 60, 0.35), rgba(15, 25, 35, 0.6));
      content: "";
    }

    .page { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: clamp(1rem, 5vw, 4rem); }
    
    .account-card { 
      padding: clamp(1.5rem, 5vw, 2.75rem); 
      background: rgba(255, 255, 255, 0.15); 
      border: 1px solid rgba(255, 255, 255, 0.45); 
      border-radius: 20px; 
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3); 
      backdrop-filter: blur(14px); 
      -webkit-backdrop-filter: blur(14px); 
    }
    
    .brand { margin: 0; text-align: center; }
    .brand a { color: var(--white); text-decoration: none; }
    .brand-mark { display: block; font: 700 clamp(2.2rem, 6vw, 3rem) / .9 "Cormorant Garamond", serif; letter-spacing: .05em; text-transform: uppercase; text-shadow: 0 2px 15px rgba(0, 0, 0, .4); }
    .brand-subtitle { display: block; margin-top: .45rem; color: var(--white); font-size: .7rem; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3); }
    
    .tabs { display: flex; gap: .35rem; margin: 2rem 0 1.7rem; padding: .25rem; border-radius: 999px; background: rgba(255, 255, 255, .25); }
    .tab { flex: 1; padding: .65rem; border-radius: 999px; color: var(--white); font: inherit; font-weight: 700; text-align: center; text-decoration: none; }
    .tab:hover, .tab:focus-visible { background: rgba(255, 255, 255, .3); }
    
    h1 { margin: 0; font: 600 2.2rem / 1 "Cormorant Garamond", serif; text-align: center; color: var(--white); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3); }
    .intro { margin: .65rem 0 1.7rem; color: rgba(255, 255, 255, 0.9); font-size: .92rem; text-align: center; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
    
    fieldset { margin: 0; padding: 0; border: 0; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: .4rem; color: var(--white); font-size: .85rem; font-weight: 700; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4); }
    
    input { width: 100%; padding: .85rem 1rem; border: 1px solid var(--line); border-radius: .65rem; color: #1e293b; background: rgba(255, 255, 255, 0.88); font: inherit; }
    input::placeholder { color: #64748b; }
    input:focus { outline: 3px solid rgba(255, 255, 255, .8); border-color: var(--white); background: #ffffff; }
    
    .form-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: .25rem 0 1.5rem; }
    .check { display: flex; align-items: center; gap: .45rem; margin: 0; color: var(--white); font-size: .8rem; font-weight: 600; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4); }
    .check input { width: auto; accent-color: #287b9a; }
    .form-link { color: var(--white); font-size: .8rem; font-weight: 700; text-decoration: underline; }
    
    .field-error { display: block; margin-top: .35rem; color: #ff8080; font-size: .78rem; font-weight: 700; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
    input.is-invalid { border-color: #ff8080; }
    
    .form-feedback { margin: 0 0 1rem; font-size: .85rem; font-weight: 700; text-align: center; }
    .form-feedback.error { color: #ff8080; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    
    button { width: 100%; padding: .85rem 1rem; border: 0; border-radius: .65rem; color: var(--white); background: #287b9a; cursor: pointer; font: inherit; font-weight: 700; box-shadow: 0 .45rem 1rem rgba(0, 0, 0, .25); transition: background 0.2s ease; }
    button:hover, button:focus-visible { background: #1c5d76; }
    
    .switch { margin: 1.5rem 0 0; color: var(--white); font-size: .84rem; text-align: center; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4); }
    .switch a { color: var(--white); font-weight: 700; text-decoration: underline; }

    @media (max-width: 480px) {
      .page { padding: 1rem; }
      .account-card { padding: 1.5rem 1.15rem; }
      .form-row { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="page container-fluid row">
    <section class="account-card shadow-lg col-xl-3 col-lg-4 col-md-6 col-sm-12 col-12" aria-label="Account access">
      <header class="brand">
        <a href="login.html"><span class="brand-mark">ApexAuto</span><span class="brand-subtitle">Precision in Every Turn</span></a>
      </header>

      <!-- Switch between login and registration. -->
      <nav class="tabs nav nav-pills" aria-label="Account pages">
        <a class="tab nav-link" href="login.html" aria-current="page">Login</a>
        <a class="tab nav-link" href="register.html">Register</a>
      </nav>

      <section aria-labelledby="login-title">
        <h1 id="login-title">Welcome back</h1>
        <p class="intro">We don&apos;t pray for love, we just pray for cars.</p>
        <!-- Validation targets this form by ID. -->
        <form id="loginForm" action="landingpage.html" method="get">
          <fieldset>
            <div class="field mb-3">
              <label for="login-username">Username</label>
              <input class="form-control" type="text" id="login-username" name="username" autocomplete="username" placeholder="Enter your username" required>
            </div>
            <div class="field mb-3">
              <label for="login-password">Password</label>
              <input class="form-control" type="password" id="login-password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
            </div>
            <div class="form-row">
              <label class="check form-check-label" for="remember"><input class="form-check-input" type="checkbox" id="remember" name="remember"> Remember me</label>
              <a class="form-link" href="register.html">Need an account?</a>
            </div>
            <p id="login-feedback" class="form-feedback" role="alert" aria-live="polite"></p>
            <button class="btn btn-primary" type="submit">Login</button>
          </fieldset>
        </form>
        <p class="switch">Don&apos;t have an account? <a href="register.html">Register now</a></p>
      </section>
    </section>
  </main>

  <!-- Load jQuery before its validation plugin. -->
  <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    $(function () {
      // Demo credentials
      const demoUsername = "Iverson";
      const demoPassword = "password";

      $("#loginForm").validate({
        rules: {
          username: { required: true },
          password: { required: true }
        },
        messages: {
          username: { required: "Please enter your username." },
          password: { required: "Please enter your password." }
        },
        errorElement: "span",
        errorClass: "field-error",
        highlight: function (element) {
          $(element).addClass("is-invalid");
        },
        unhighlight: function (element) {
          $(element).removeClass("is-invalid");
        },
        submitHandler: function (form) {
          const username = $(form).find("[name='username']").val().trim();
          const password = $(form).find("[name='password']").val();
          const feedback = $("#login-feedback");

          if (username === demoUsername && password === demoPassword) {
            sessionStorage.setItem("apexAutoAuthenticated", "true");
            sessionStorage.setItem("apexAutoUsername", username);
            window.location.href = "landingpage.html";
            return false;
          }

          feedback.text("Incorrect username or password. Please try again.").addClass("error");
          return false;
        }
      });
    });
  </script>
</body>
</html>
